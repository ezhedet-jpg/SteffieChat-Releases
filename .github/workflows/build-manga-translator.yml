name: Android APK — Venice Manga Translator
on:
  push:
    branches:
      - manga-translator/venice-android
    paths-ignore:
      - 'release-apk/**'
  workflow_dispatch:
permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout translator branch
        uses: actions/checkout@v4
      - name: Restore standalone Android Studio sources
        run: |
          cat source.b64.part01 source.b64.part02 source.b64.part03 | base64 --decode > source.tbz
          tar -xjf source.tbz --strip-components=1
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK 35
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Compile debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VeniceMangaTranslator-v0.1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
      - name: Publish installable APK and unpacked sources on translator branch
        shell: bash
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/app-debug.apk release-apk/VeniceMangaTranslator-v0.1-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f release-apk/VeniceMangaTranslator-v0.1-debug.apk
          git add app/build.gradle app/src build.gradle settings.gradle gradle.properties
          git commit -m "Publish Venice manga translator debug APK and Android sources [skip ci]"
          git pull --rebase origin manga-translator/venice-android
          git push origin HEAD:manga-translator/venice-android
